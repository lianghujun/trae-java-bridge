<svg xmlns="http://www.w3.org/2000/svg" width="760" height="880" viewBox="0 0 760 880">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#00D26A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="880" rx="18" fill="#1B1C1E" stroke="#33363A" stroke-width="1.5"/>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">

    <!-- Caller -->
    <rect x="190" y="52" width="380" height="66" rx="33" fill="#1F2A24" stroke="#00D26A" stroke-width="2"/>
    <text x="380" y="80" text-anchor="middle" fill="#FFFFFF" font-size="16.5" font-weight="bold">MCP 插件 trae-java-navigator</text>
    <text x="380" y="101" text-anchor="middle" fill="#9AA0A6" font-size="12.5">4 个工具 · Skill java-navigate · 读桥接文件</text>

    <line x1="380" y1="118" x2="380" y2="166" stroke="#00D26A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="392" y="130" width="292" height="22" rx="11" fill="#242628"/>
    <text x="538" y="145" text-anchor="middle" fill="#C8CDD2" font-size="12">① HTTP 127.0.0.1:&lt;port&gt; + Bearer token</text>

    <!-- IDE container -->
    <rect x="60" y="166" width="640" height="372" rx="12" fill="none" stroke="#4B4F52" stroke-width="1.3" stroke-dasharray="7 6"/>
    <text x="80" y="191" fill="#8A8F94" font-size="13">Trae IDE（VS Code 内核）</text>

    <rect x="80" y="206" width="600" height="196" rx="10" fill="#1D2A23" stroke="#00D26A" stroke-width="2"/>
    <text x="102" y="234" fill="#FFFFFF" font-size="15.5" font-weight="bold">trae-java-bridge 扩展（本工程）</text>
    <text x="102" y="259" fill="#C8CDD2" font-size="12.5">HTTP 服务：127.0.0.1 随机端口 + Bearer token</text>
    <text x="102" y="280" fill="#9AA0A6" font-size="12">状态栏：正常 / 请求失败 / 离线（含端口与警告色）</text>
    <text x="102" y="300" fill="#9AA0A6" font-size="12">通知：启动失败、连续请求失败、停用</text>
    <text x="102" y="320" fill="#9AA0A6" font-size="12">设置：enabled · port · commandTimeout</text>
    <text x="102" y="340" fill="#9AA0A6" font-size="12">命令：查看状态 / 重启桥接</text>
    <text x="102" y="364" fill="#7FD3A2" font-size="12">窗口启动即监听；工作区变化重写桥接文件</text>
    <rect x="618" y="216" width="56" height="22" rx="11" fill="#00D26A"/>
    <text x="646" y="231" text-anchor="middle" fill="#10241A" font-size="12" font-weight="bold">推荐</text>

    <!-- Bridge file -->
    <rect x="80" y="420" width="600" height="98" rx="10" fill="#1A1B1D" stroke="#6B7075" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="102" y="447" fill="#D0D5DA" font-size="13.5" font-weight="bold">桥接文件：%TEMP%\trae-java-bridge\&lt;hash&gt;-&lt;pid&gt;.json</text>
    <text x="102" y="470" fill="#9AA0A6" font-size="12">字段：port · token · pid · windowId · workspaceFolders · redhatJavaPath · lombok</text>
    <text x="102" y="491" fill="#9AA0A6" font-size="12">多窗口按 pid 隔离；关闭即删除；崩溃残留由 MCP 按 pid 清理</text>

    <line x1="380" y1="552" x2="380" y2="600" stroke="#00D26A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="392" y="565" width="120" height="22" rx="11" fill="#242628"/>
    <text x="452" y="580" text-anchor="middle" fill="#C8CDD2" font-size="12">② vscode API</text>

    <rect x="80" y="600" width="600" height="68" rx="10" fill="#202124" stroke="#3A3D40" stroke-width="1.5"/>
    <text x="102" y="627" fill="#E6E8EA" font-size="14.5" font-weight="bold">redhat.java 扩展（extensionDependencies）</text>
    <text x="102" y="649" fill="#9AA0A6" font-size="12.5">JDT LS 客户端 · Problems · 实时诊断</text>

    <line x1="380" y1="668" x2="380" y2="712" stroke="#00D26A" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <rect x="392" y="679" width="112" height="22" rx="11" fill="#242628"/>
    <text x="448" y="694" text-anchor="middle" fill="#C8CDD2" font-size="12">③ stdio LSP</text>

    <rect x="80" y="712" width="600" height="58" rx="10" fill="#202124" stroke="#3A3D40" stroke-width="1.5"/>
    <text x="102" y="738" fill="#E6E8EA" font-size="14.5" font-weight="bold">IDE JDT LS（redhat.java 自带 JRE）</text>
    <text x="102" y="758" fill="#9AA0A6" font-size="12.5">索引 / 编译诊断 / 定义 / 引用</text>

    <!-- Write locations -->
    <rect x="60" y="788" width="640" height="48" rx="10" fill="none" stroke="#4B4F52" stroke-width="1.2" stroke-dasharray="6 5"/>
    <text x="80" y="817" fill="#9AA0A6" font-size="11.5">写入位置：仅 %TEMP%\trae-java-bridge\ 与 %TEMP%\trae-java-navigator\；工程目录只读</text>

    <!-- Legend -->
    <line x1="70" y1="856" x2="130" y2="856" stroke="#00D26A" stroke-width="3"/>
    <text x="140" y="860" fill="#D0D5DA" font-size="12.5">本扩展能力</text>
    <line x1="300" y1="856" x2="360" y2="856" stroke="#6B7075" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="370" y="860" fill="#D0D5DA" font-size="12.5">运行态文件 / 外部依赖</text>
  </g>
</svg>